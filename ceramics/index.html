<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceramics — Jaeyoon Jung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    /* Nav */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      z-index: 10;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    nav a:hover {
      opacity: 0.6;
    }

    nav .site-name {
      font-size: 1rem;
      font-weight: 500;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 280px;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.8;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: #e0e0e0;
      margin-top: 3px;
    }

    .grid-item {
      overflow: hidden;
      background: #f5f5f5;
    }

    .grid-item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .grid-item:hover img {
      transform: scale(1.03);
    }

    /* Footer */
    footer {
      padding: 40px 32px;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      color: #1a1a1a;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a class="site-name" href="../index.html">Jaeyoon Jung</a>
  </nav>

  <div class="hero">
    <h1>Ceramics</h1>
    <p>I occasionally make things on a wheel.</p>
  </div>

  <div class="grid">
    <div class="grid-item">
      <img src="ramen-bowl.png" alt="Ramen Bowl" />
    </div>
    <div class="grid-item">
      <img src="vase-french-white-n-cv-orange.png" alt="Vase, French White & Orange" />
    </div>
    <div class="grid-item">
      <img src="mini-plates-amethyst.png" alt="Mini Plates, Amethyst" />
    </div>
    <div class="grid-item">
      <img src="thin-neck-vase.png" alt="Thin Neck Vase" />
    </div>
    <div class="grid-item">
      <img src="plate-transparent-n-blue.png" alt="Plate, Transparent & Blue" />
    </div>
    <div class="grid-item">
      <img src="blue-in-green-vase.png" alt="Blue in Green Vase" />
    </div>
  </div>

  <footer>
    <a href="../index.html">← Back</a>
  </footer>

</body>
</html>
