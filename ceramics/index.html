<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceramics — Jaeyoon Jung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF7F0;
      --ink: #241E17;
      --clay: #B4552D;
      --muted: #8a7d6b;
      --body-muted: #5c5347;
      --border: #E5DCCB;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    a { color: var(--clay); text-decoration: none; }
    a:hover { opacity: 0.75; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 26px 48px; }
    .site-name { font-family: var(--serif); font-size: 24px; font-style: italic; color: var(--ink); }
    .nav-links { display: flex; gap: 28px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-links a { color: var(--ink); }
    .nav-links a.accent { color: var(--clay); }
    header { padding: 64px 48px 48px; }
    .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 20px; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 8vw, 96px); line-height: 1; margin-bottom: 20px; }
    h1 em { color: var(--clay); }
    .sub { font-family: var(--serif); font-style: italic; font-size: 24px; color: var(--body-muted); }
    .band { background: var(--clay); height: 56px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 64px 48px; }
    figure img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; transition: transform 0.3s ease; display: block; }
    figure img:hover { transform: translateY(-8px); }
    figcaption { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); margin-top: 10px; }
    footer { padding: 48px; text-align: center; border-top: 1px solid var(--border); }
    footer a { color: var(--muted); font-size: 15px; }
    @media (max-width: 800px) {
      nav, header { padding-left: 24px; padding-right: 24px; }
      .nav-links { gap: 16px; }
      .grid { grid-template-columns: repeat(2, 1fr); padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="site-name" href="../index.html">Jaeyoon Jung</a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../index.html#writing">Writing</a>
      <a href="https://linkedin.com/in/jaeyoon-j/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="accent" href="mailto:jaeyoonjung95@gmail.com">Email me</a>
    </div>
  </nav>

  <header>
    <div class="kicker">OFF HOURS</div>
    <h1>Ceramics<em>.</em></h1>
    <p class="sub">I occasionally make things on a wheel.</p>
  </header>

  <div class="band"></div>

  <div class="grid">
    <figure><img src="ramen-bowl.png" alt="Ramen Bowl" /><figcaption>RAMEN BOWL</figcaption></figure>
    <figure><img src="vase-french-white-n-cv-orange.png" alt="Vase, French White &amp; Orange" /><figcaption>VASE — FRENCH WHITE &amp; ORANGE</figcaption></figure>
    <figure><img src="mini-plates-amethyst.png" alt="Mini Plates, Amethyst" /><figcaption>MINI PLATES — AMETHYST</figcaption></figure>
    <figure><img src="thin-neck-vase.png" alt="Thin Neck Vase" /><figcaption>THIN NECK VASE</figcaption></figure>
    <figure><img src="plate-transparent-n-blue.png" alt="Plate, Transparent &amp; Blue" /><figcaption>PLATE — TRANSPARENT &amp; BLUE</figcaption></figure>
    <figure><img src="blue-in-green-vase.png" alt="Blue in Green Vase" /><figcaption>BLUE IN GREEN VASE</figcaption></figure>
  </div>

  <footer>
    <a href="../index.html">← Back home</a>
  </footer>
</body>
</html>
